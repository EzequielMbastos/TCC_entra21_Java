<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chave Mestra - Início</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper" style="width: 260px; min-height: 100vh;">
      <div class="sidebar-heading text-center py-3">
        <i class="bi bi-key-fill text-warning" style="font-size: 3rem;"></i>
        <h5 class="text-warning">Chave Mestra</h5>
      </div>
      <div class="list-group list-group-flush">
        <a href="index.html" class="list-group-item list-group-item-action bg-dark text-white active"><i class="bi bi-speedometer2 me-2"></i> Início</a>
        <a href="atendimento.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-cart-plus me-2"></i> Novo Atendimento</a>
        <a href="produtos.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-box-seam me-2"></i> Produtos</a>
        <a href="servicos.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-wrench me-2"></i> Serviços</a>
        <a href="clientes.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-people me-2"></i> Clientes</a>
        <a href="financeiro.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-cash-stack me-2"></i> Financeiro</a>
        <a href="relatorios.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-bar-chart me-2"></i> Relatórios</a>
        <a href="assistente-ia.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-stars me-2"></i> Assistente IA</a>
      </div>
    </div>
    <!-- Page Content -->
    <div id="page-content-wrapper" class="flex-grow-1 p-3" style="background-color: #f0f2f5;">
      <nav class="navbar navbar-light bg-white shadow-sm mb-3 rounded">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary" id="menu-toggle"><i class="bi bi-list"></i></button>
          <span class="navbar-text text-muted small" id="data-hora"></span>
        </div>
      </nav>

      <div id="conteudo-pagina">
        <div class="dashboard-shell">
          <div class="dashboard-main">
            <!-- Cards de resumo -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <div class="card card-resumo shadow-sm">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                      <div>
                        <h6 class="text-muted">Vendas do dia</h6>
                        <h3 class="mb-0" id="vendas-dia">R$ 0,00</h3>
                      </div>
                      <i class="bi bi-cash-coin text-warning" style="font-size: 2.5rem;"></i>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card shadow-sm">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                      <div>
                        <h6 class="text-muted">Atendimentos</h6>
                        <h3 class="mb-0" id="qtd-atendimentos">0</h3>
                      </div>
                      <i class="bi bi-cart-check text-primary" style="font-size: 2.5rem;"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Últimos atendimentos -->
            <div class="card shadow-sm">
              <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Últimos Atendimentos</h5>
              </div>
              <div class="card-body" id="ultimos-atendimentos">
                <p class="text-muted text-center">Carregando...</p>
              </div>
            </div>
          </div>

          <aside class="dashboard-side-column" aria-label="Alertas da loja">
            <div class="floating-panel panel-estoque">
              <div class="panel-header">
                <div class="d-flex align-items-center gap-2">
                  <i class="bi bi-box-seam"></i>
                  <h6>Estoque baixo</h6>
                </div>
                <span class="panel-badge" id="estoque-baixo">0</span>
              </div>
              <div class="panel-body" id="lista-estoque-baixo">
                <p class="text-muted text-center mb-0">Carregando...</p>
              </div>
            </div>

            <div class="floating-panel panel-contas">
              <div class="panel-header">
                <div class="d-flex align-items-center gap-2">
                  <i class="bi bi-exclamation-triangle"></i>
                  <h6>Contas a pagar</h6>
                </div>
                <span class="panel-badge badge-danger" id="contas-vencendo">0</span>
              </div>
              <div class="panel-body" id="lista-contas-pagar">
                <p class="text-muted text-center mb-0">Carregando...</p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
