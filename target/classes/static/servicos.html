<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chave Mestra - Serviços</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/estilo.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex" id="wrapper">
    <div class="bg-dark text-white" id="sidebar-wrapper" style="width: 260px; min-height: 100vh;">
      <div class="sidebar-heading text-center py-3">
        <i class="bi bi-key-fill text-warning" style="font-size: 3rem;"></i>
        <h5 class="text-warning">Chave Mestra</h5>
      </div>
      <div class="list-group list-group-flush">
        <a href="index.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-speedometer2 me-2"></i>Início</a>
        <a href="atendimento.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-cart-plus me-2"></i>Novo Atendimento</a>
        <a href="produtos.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-box-seam me-2"></i>Produtos</a>
        <a href="servicos.html" class="list-group-item list-group-item-action bg-dark text-white active"><i class="bi bi-wrench me-2"></i>Serviços</a>
        <a href="clientes.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-people me-2"></i>Clientes</a>
        <a href="financeiro.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-cash-stack me-2"></i>Financeiro</a>
        <a href="relatorios.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-bar-chart me-2"></i>Relatórios</a>
        <a href="assistente-ia.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-stars me-2"></i>Assistente IA</a>
      </div>
    </div>

    <div id="page-content-wrapper" class="flex-grow-1 p-3" style="background-color: #f0f2f5;">
      <nav class="navbar navbar-light bg-white shadow-sm mb-3 rounded">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary" id="menu-toggle"><i class="bi bi-list"></i></button>
          <span class="navbar-text text-muted small" id="data-hora"></span>
        </div>
      </nav>

      <div id="conteudo-pagina">
        <div class="card shadow-sm">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-wrench me-2"></i>Serviços</h5>
            <button class="btn btn-ouro" id="btn-novo-servico" data-bs-toggle="modal" data-bs-target="#modalServico">
              <i class="bi bi-plus-lg me-1"></i>Novo serviço
            </button>
          </div>
          <div class="card-body">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <input type="text" id="servico-busca" class="form-control" placeholder="Buscar serviço por nome...">
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Nome</th>
                    <th>Preço base</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="servicos-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalServico" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formServico">
          <div class="modal-header">
            <h5 class="modal-title">Serviço</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="servico-id">
            <div class="mb-3">
              <label class="form-label">Nome do serviço</label>
              <input type="text" id="servico-nome" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Preço base</label>
              <input type="number" id="servico-preco" class="form-control" step="0.01" min="0" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/servicos.js"></script>
</body>
</html>
